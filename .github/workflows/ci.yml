name: CI

# Bare push/pull_request keys (no branches filter) mean every branch. A workflow
# only runs from the branch it lives on, so filtering to main meant no feature
# branch was ever verified before merge.
on:
  push:
  pull_request:

concurrency:
  # A same-repo PR fires both push and pull_request. Keying on the PR number when
  # present collapses the two into one cancellable group instead of running the
  # whole matrix twice.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Never let one leg cancel another: a version-specific failure has to stay
      # distinguishable from a universal one. That distinction is the whole point
      # of this matrix.
      fail-fast: false
      matrix:
        node: ['20', '22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Must stay ahead of Setup Node, whose pnpm store cache needs the pnpm
      # binary to already exist. No version input: pnpm 9.0.0 is derived from
      # package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      # The build runs on every leg because it is real signal; only the upload is
      # restricted to one, because upload-artifact returns 409 on duplicate
      # artifact names across a matrix. Node 24 is Active LTS.
      - name: Upload plugin artifact
        if: matrix.node == '24'
        uses: actions/upload-artifact@v5
        with:
          name: drift-plugin
          path: dist/plugin_package.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Verify (Windows)
    # A sibling job, not a matrix entry on `verify`. The ubuntu leg runs four
    # Node versions and this one runs a single Node 20; folding them into one
    # matrix would either quadruple Windows minutes or dilute the Node matrix.
    #
    # Blocking from day one, deliberately: no continue-on-error and no `if:`
    # guard on the job. A leg nobody must heed is the weakness that already
    # applies to the probe workflow, and this job exists to replace that probe
    # with something permanent.
    runs-on: windows-latest
    # Read-only content access is all this job needs — it uploads nothing and
    # writes nothing back. A deliberate narrowing of the write-capable default
    # this workflow otherwise inherits on same-repo pushes. The workflow-level
    # and `verify`-job permissions are untouched.
    permissions:
      contents: read
    # MEASURED, not a starting value. Two real green runs of this leg, both
    # 2026-08-20, both wall-clock for the `Verify (Windows)` job:
    #   87s  COLD pnpm cache ("pnpm cache is not found")
    #        https://github.com/six2dez/drift/actions/runs/32377727473
    #   91s  WARM pnpm cache ("Cache restored successfully")
    #        https://github.com/six2dez/drift/actions/runs/32378144861
    #
    # Note which way round those came out. The warm run was 4s SLOWER, so the
    # pnpm store cache is NOT the dominant term here and a cold cache is not
    # the worst case — install is ~8s of a ~90s job either way. Recorded as
    # measured rather than as the "cold is pessimistic" story that would have
    # been reasonable to assume and is wrong.
    #
    # 6 minutes is ~4x the measured ~90s, which absorbs Windows runner variance
    # without letting a genuinely hung child hold a runner. Note what this
    # ceiling does NOT guard: a slow spawn fails its own test timeout
    # (15000ms in mcp-server-spec.spawn.test.ts, 5000ms in the transport
    # tests) long before this fires. This only bounds a hang.
    #
    # Re-derive it, do not raise it reflexively, if this leg ever grows a step.
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Must stay ahead of Setup Node, whose pnpm store cache needs the pnpm
      # binary to already exist — the same ordering the ubuntu job above
      # documents. The stakes are higher on this OS and the failure was
      # measured, not inferred: the Node setup action's pnpm cache default is
      # deliberately left at its shipped value, and it auto-enables pnpm
      # caching whenever package.json carries a packageManager field (this
      # one's says pnpm@9.0.0), so the action shells out to a pnpm binary. A
      # Windows job with no prior pnpm step therefore dies right here with
      # "Unable to locate executable file: pnpm" before a step of its own ever
      # runs — observed on run 31702174047 (2026-08-13).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm

      # `shell: bash` is pinned on every run step in this job and is not
      # stylistic. The default shell on a Windows runner is pwsh; GitHub
      # Actions maps `shell: bash` to `bash --noprofile --norc -eo pipefail
      # {0}` identically on every OS, and pipefail is what makes a piped
      # command return the real exit code instead of the last stage's.
      #
      # This gate runs before Install dependencies so an install failure cannot
      # skip it, and so it fails fast before anything could be printed.
      #
      # The step name states exactly what the pattern below can prove — a Caido
      # token reference and a GitHub secrets expression — and nothing wider. A
      # literal credential pasted into either file (a bare JWT, a hex blob, a
      # Bearer header) is the likeliest real accident and this grep cannot see
      # it; neither can it see bracket-indexed expressions or env-var
      # indirection. Overstating the guarantee is worse than the gap, because
      # later phases inherit this gate as standing protection.
      #
      # The pattern is written to be self-non-matching against its own source
      # text, and that property is load-bearing: a pattern that matched this
      # file would fail the gate permanently. Fix the name, not the regex.
      #
      # windows-llrt-probe.yml stays in the scan-target list on purpose even
      # though it is stamped for deletion in Phase 9. When that deletion lands,
      # grep returns 2 and the third arm below fails this job loudly — which is
      # the intended prompt to re-point the list, instead of a scan that
      # silently narrows to one file. Carrying this gate here is what lets it
      # outlive the probe it came from.
      - name: 'Gate: no secret material in CI configuration'
        shell: bash
        run: |
          # No `test -f` pre-check here, unlike the probe workflow's copy: the
          # third arm IS the missing-target guard, so a deleted or renamed scan
          # target fails through grep's own status rather than through a
          # separate assertion that would shadow it.
          #
          # `shell: bash` resolves to `bash --noprofile --norc -eo pipefail
          # {0}`, so -e is active and a bare non-zero grep would abort this
          # step before any branch could run. The left side of || is a
          # condition context, so this form is -e-safe and still captures the
          # status.
          status=0
          grep -nE 'CAIDO_(TOKEN)|secret(s)\.' \
            .github/workflows/ci.yml \
            .github/workflows/windows-llrt-probe.yml || status=$?
          # Three arms, not two. grep exits 0 on a match, 1 on no match, and 2
          # when a target is missing or unreadable. An if/else would route that
          # 2 into the pass arm and silently green-light exactly the edit this
          # gate exists to catch. Do NOT collapse the third arm into the second.
          if [ "$status" -eq 0 ]; then
            echo "Gate failed: a Caido token reference or a GitHub secrets expression appears in a scanned file (see the match above)."
            exit 1
          elif [ "$status" -eq 1 ]; then
            echo "Gate passed: no Caido token reference and no GitHub secrets expression in .github/workflows/ci.yml or .github/workflows/windows-llrt-probe.yml"
          else
            echo "Gate failed: could not read its scan targets (grep status $status)."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        shell: bash
        run: pnpm -r typecheck

      - name: Lint
        shell: bash
        run: pnpm lint

      - name: Test
        shell: bash
        run: pnpm exec vitest run

      # WR-08. The step above is the ONLY place spawn-plan.win32.test.ts can run,
      # and that file is the only evidence for PRV-01/PRV-02's cmd.exe escaping
      # contract - the maintainer cannot test native Windows, so there is no
      # second source. It is gated by `describe.skipIf(process.platform !==
      # "win32")`, which means it goes green by SKIPPING everywhere else. A bare
      # `vitest run` asserts nothing about which files executed, so a filename
      # that drifts out of the default include glob, an inverted predicate, or a
      # move under an excluded path all leave this leg green with ZERO Windows
      # coverage. That is the most expensive defect class in this project: a
      # false green on the only platform nobody can check by hand.
      #
      # A per-run skip COUNT is not usable as the signal on its own, because the
      # Linux legs legitimately report these same cases as skipped. The assertion
      # has to be Windows-side and has to be about execution, which is what
      # re-running the one file with the JSON reporter buys.
      #
      # Re-running the file costs about a second and does not replace the step
      # above: the full suite still runs, and this step exists only to read a
      # machine-checkable count out of it.
      - name: 'Gate: the win32 spawn-plan suite actually ran'
        shell: bash
        run: |
          # Written to the runner temp dir, not the checkout: `pnpm build` runs
          # after this step and must package exactly what a release does.
          report="$RUNNER_TEMP/win32-report.json"
          pnpm exec vitest run packages/backend/src/spawn-plan.win32.test.ts \
            --reporter=json --outputFile="$report"
          # Three conditions, and each one fails a different way of going green
          # with nothing executed: pending>0 is the skipIf still gating; total=0
          # is the file no longer being collected at all (a glob or path change);
          # passed<total is a real failure the reporter would otherwise let
          # through, since this step reads the file rather than the exit status.
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf-8"));
            const passed = report.numPassedTests ?? 0;
            const pending = report.numPendingTests ?? 0;
            const total = report.numTotalTests ?? 0;
            if (pending > 0 || total === 0 || passed !== total) {
              console.error(
                "Gate failed: the win32 spawn-plan suite did not execute cleanly on this host " +
                  JSON.stringify({ passed, pending, total })
              );
              process.exit(1);
            }
            console.log("Gate passed: the win32 spawn-plan suite ran " + total + " tests on this host.");
          ' "$report"

      # The one step this whole leg exists for on top of the suite: `pnpm build`
      # is only runnable here because the root build script was reduced to a
      # single cross-platform command in the same plan. pnpm runs script bodies
      # through cmd.exe on this OS, and the runner image ships no `zip`.
      #
      # The `test -f` is not decoration. caido-dev's own success line reads
      # "Plugin package zip file created successfully" and names no path, so on
      # its own it proves a zip, not THE zip release.yml signs. Asserting the
      # exact artifact path is what makes this step evidence for CI-01 rather
      # than a green tick — and it is the one place a Windows-only packaging
      # divergence would surface.
      - name: Build
        shell: bash
        run: |
          pnpm build
          test -f dist/plugin_package.zip
          ls -l dist/plugin_package.zip
