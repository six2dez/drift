name: Release

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Verify main branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "Release can only be run from the main branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm exec vitest run

      - name: Build plugin
        run: pnpm build

      - name: Sign plugin zip
        working-directory: dist
        run: |
          if [[ -z "${{ secrets.PRIVATE_KEY }}" ]]; then
            echo "Missing PRIVATE_KEY secret. Add an Ed25519 private key at Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
          openssl pkeyutl -sign \
            -inkey private_key.pem \
            -out plugin_package.zip.sig \
            -rawin -in plugin_package.zip
          rm -f private_key.pem

      - name: Resolve plugin version
        id: meta
        working-directory: dist
        run: |
          VERSION=$(unzip -p plugin_package.zip manifest.json | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: caido/action-release@v1
        with:
          tag: ${{ steps.meta.outputs.version }}
          commit: ${{ github.sha }}
          body: "Drift v${{ steps.meta.outputs.version }}"
          artifacts: "dist/plugin_package.zip,dist/plugin_package.zip.sig"
          immutableCreate: true
